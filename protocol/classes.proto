syntax = "proto3";

package lingcat.classes;

/** 
 * =======================================================
 *
 *                          基础类
 *
 * =======================================================
 */

message Package {
    // 方法 ID
    uint32 method_id = 1;
    // 标志位
    uint32 flags = 2;
    // 请求 ID
    bytes request_id = 3;
    // 序号
    uint32 seq = 4;
    
    // 负载数据（明文或密文）
    bytes data = 5;
    
    // 初始化向量
    bytes iv = 6;
    // 附加认证数据
    bytes aad = 7;
    // 认证标签
    bytes tag = 8;
    
    // 发送方服务器域名（本地通信为 null）
    optional string origin_server = 9;
    // 联邦签名
    optional bytes signature = 10;
    // 协议版本
    optional uint32 protocol_version = 11;
}

message FederationPackage {
    string origin_server = 1;
    string target_server = 2;
    // 时间戳, 防止重放
    uint64 timestamp = 3;
    bytes payload = 4;
    // 服务端 Ed25519 签名
    bytes signature = 5;
}

message IUser {
    string id = 1;
    optional string username = 2;
    string nickname = 3;
    optional string description = 4;
    optional string avatar_file_hash = 5;
}

message IChatAdmin {
    string id = 1;
    optional string username = 2;
    string nickname = 3;
    optional string description = 4;
    optional string avatar_file_hash = 5;
    
    string role = 6;
    string permissions = 7;
    string belong_to_chat_id = 8;
}

message IChat {
    string id = 1;
    optional string title = 2;
    optional string chat_unique = 3;
    string type = 4;
    optional string avatar_file_hash = 5;
    string settings = 6;
    uint32 last_message_id = 7;
    uint64 last_message_time = 8;
    optional string description = 9;
    optional string last_message_text = 10; 
    bool is_member = 11;
}

message IFile {
    string hash = 1;
    optional string first_upload_file_name = 2;
    optional string belong_to_chat_id = 3;
    string mime = 4;
    uint64 uploaded_at = 5;
}

message IMessageEntity {
    // 类型: bold, italic, code, strikethrough, spoiler,
    //       attachment, link, chat_mention, user_mention
    string type = 1;
    // UTF-16 码元起始位置
    uint32 offset = 2;
    // UTF-16 码元长度
    uint32 length = 3;
    // 语义取决于 type，纯样式 entity 可省略
    optional string data = 4;
}

message IMessage {
    uint32 id = 1;
    optional string sender_user_id = 2;
    optional bool system = 3;
    string chat_id = 4;
    string text = 5;
    uint64 time = 6;
    repeated IMessageEntity entities = 7;
}
