<!doctype html>
<html lang="zh-CN" class="mdui-theme-auto">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover"/>
    <meta name="renderer" content="webkit"/>
    <meta name="theme-color" content="#141414"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta name="apple-mobile-web-app-title" content="灵猫"/>
    <link rel="icon" href="icon.png"/>
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
    <link rel="manifest" href="manifest.webmanifest"/>
    <link rel="style" href="static/material_icons.css"/>

    <title>灵猫</title>
    <script src="main.ts" type="module"></script>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--mdui-color-surface, #141414);
      }
      #app {
        height: 100%;
        box-sizing: border-box;
        /* iOS 刘海 / 灵动岛 / home indicator 安全区 */
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
      }
    </style>
  </head>
  <body id="app" style="display: flex; height: 100%;"></body>
