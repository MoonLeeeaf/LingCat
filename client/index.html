<!doctype html>
<html lang="zh-CN" class="mdui-theme-auto">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover"/>
    <meta name="renderer" content="webkit"/>
    <link rel="icon" href="icon.png"/>
    <link rel="manifest" href="manifest.webmanifest"/>
    <link rel="stylesheet" href="static/material_icons.css"/>

    <title>灵猫</title>
    <script src="main.ts" type="module"></script>
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overscroll-behavior: none;
      }

      #app {
        display: flex;
        padding-top: var(--sat);
        padding-bottom: var(--sab);
        padding-left: var(--sal);
        padding-right: var(--sar);
        height: 100%;
        width: 100%;
      }

      /* 统一滚动条 (跟随 mdui 主题色) */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: rgba(var(--mdui-color-outline), 0.38);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(var(--mdui-color-outline), 0.58);
      }
      ::-webkit-scrollbar-thumb:active {
        background-color: rgba(var(--mdui-color-outline), 0.72);
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      /* Firefox: 仅在其上使用标准属性, 避免覆盖 WebKit 自定义样式 */
      @supports (-moz-appearance: none) {
        * {
          scrollbar-width: thin;
          scrollbar-color: rgba(var(--mdui-color-outline), 0.38) transparent;
        }
      }
    </style>
  </head>
  <body id="app"></body>
</html>
