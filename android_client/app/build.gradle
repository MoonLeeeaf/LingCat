apply plugin: 'com.android.application'

android {
    namespace "io.github.moonleeeaf.lingcat"

    compileSdk 34
    defaultConfig {
        applicationId "io.github.moonleeeaf.lingcat"
        minSdk 21
        targetSdk 34
        versionCode 1000
        versionName "0.1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
